<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Collection - Cart</title>
    <style>body {
    font-family: Arial, sans-serif;
    background-image: url('backg.jpg');
    background-size: cover;
    background-position: center;
    margin: 0;
    padding: 0;
}

.cart-container {
    background: rgba(255, 255, 255, 0.9);
    margin: 50px auto;
    width: 80%;
    max-width: 800px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.cart-header, .cart-item {
    display: grid;
    grid-template-columns: 3fr 1fr 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
    text-align: center;
    font-weight: bold;
}

.cart-header {
    background: #333;
    color: white;
    padding: 10px;
    border-radius: 5px;
}

.cart-item {
    align-items: center;
}

.cart-item img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 5px;
}

.cart-item span, .cart-item input, .cart-item button {
    text-align: center;
    font-size: 14px;
}

.cart-item input {
    width: 50px;
    padding: 5px;
    text-align: center;
}

.cart-item button {
    padding: 5px 10px;
    background: #ff4d4d;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s;
}

.cart-item button:hover {
    background: #ff1a1a;
}

.cart-footer {
    text-align: right;
    margin-top: 20px;
}

.cart-footer h2 {
    margin-bottom: 10px;
}

#checkout-btn {
    padding: 10px 20px;
    background: #333;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.3s;
}

#checkout-btn:hover {
    background: #555;
}
.back-button {
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 15px;
    font-size: 16px;
    color: white;
    background: #333;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s;
    text-decoration: none;
}

.back-button:hover {
    background: #555;
}
</style>
</head>
<body>
    <div class="cart-container">
      <button class="back-button" onclick="goBack()">← Back</button>
        <h1>Shopping Cart</h1>
        <div class="cart">
            <div class="cart-header">
                <span>Item</span>
                <span>Price</span>
                <span>Quantity</span>
                <span>Total</span>
                <span>Actions</span>
            </div>
            <div class="cart-items">
                <!-- Items will be dynamically added here -->
            </div>
            <div class="cart-footer">
                <h2>Total: Rs<span id="cart-total">0.00</span></h2>
                <button id="checkout-btn">Checkout</button>
            </div>
        </div>
    </div>
    <script>const cartItems = [
    {
        id: 1,
        name: "Classic Watch",
        price: 1999.99,
        quantity: 1,
        image: "watch1.jpg"
    },
    {
        id: 2,
        name: "Luxury Watch",
        price: 2999.99,
        quantity: 1,
        image: "watch2.jpg"
    }
];

const cartItemsContainer = document.querySelector(".cart-items");
const cartTotal = document.getElementById("cart-total");

function updateCartTotal() {
    let total = 0;
    cartItems.forEach(item => {
        total += item.price * item.quantity;
    });
    cartTotal.textContent = total.toFixed(2);
}
function goBack() {
    window.history.back(); // Goes back to the previous page
    // Alternatively, redirect to a specific page:
    // window.location.href = 'index.html'; // Replace 'index.html' with your desired page
}

function renderCartItems() {
    cartItemsContainer.innerHTML = "";
    cartItems.forEach(item => {
        const cartRow = document.createElement("div");
        cartRow.classList.add("cart-item");
        cartRow.innerHTML = `
            <span>${item.name}</span>
            <span>Rs${item.price.toFixed(2)}</span>
            <input type="number" min="1" value="${item.quantity}" data-id="${item.id}">
            <span>Rs${(item.price * item.quantity).toFixed(2)}</span>
            <button data-id="${item.id}">Remove</button>
        `;
        cartItemsContainer.appendChild(cartRow);
    });
    attachEventListeners();
    updateCartTotal();
}

function attachEventListeners() {
    const quantityInputs = document.querySelectorAll(".cart-item input");
    const removeButtons = document.querySelectorAll(".cart-item button");

    quantityInputs.forEach(input => {
        input.addEventListener("change", event => {
            const itemId = parseInt(event.target.getAttribute("data-id"));
            const item = cartItems.find(item => item.id === itemId);
            item.quantity = Math.max(1, parseInt(event.target.value));
            renderCartItems();
        });
    });

    removeButtons.forEach(button => {
        button.addEventListener("click", event => {
            const itemId = parseInt(event.target.getAttribute("data-id"));
            const itemIndex = cartItems.findIndex(item => item.id === itemId);
            cartItems.splice(itemIndex, 1);
            renderCartItems();
        });
    });
}

document.getElementById("checkout-btn").addEventListener("click", () => {
    alert("Proceeding to checkout...");
});

renderCartItems();
</script>
</body>
</html>
