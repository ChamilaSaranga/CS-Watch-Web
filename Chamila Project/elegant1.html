<style>.dark-theme {
    background-color: #1e1e2f;
    color: #e6e6e6;
    padding: 50px 20px;
    text-align: center;
  }
  
  .dark-theme h2 {
    font-size: 36px;
    margin-bottom: 30px;
    color: #f9c806;
  }
  
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  
  .clock-cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
  }
  
  .clock-card {
    background-color: #29293d;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    width: 250px;
    padding: 20px;
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  
  .clock-card img {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 15px;
  }
  
  .clock-card h3 {
    font-size: 20px;
    color: #f9c806;
    margin-bottom: 10px;
  }
  
  .clock-card p {
    font-size: 16px;
    color: #e6e6e6;
    margin-bottom: 15px;
  }
  
  .clock-card button {
    background-color: #f9c806;
    color: #29293d;
    border: none;
    border-radius: 5px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  
  .clock-card button:hover {
    background-color: #e6e6e6;
    color: #1e1e2f;
  }
  
  .clock-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
  }
  .back-btn {
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 15px;
    font-size: 16px;
    color: white;
    background:blue;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s;
    text-decoration: none;
    margin-left: -1000px;
}

.back-btn:hover {
    background: #555;
}0
  </style>
  <section id="clocks" class="dark-theme">
    <button class="back-btn" onclick="goBack()">Back</button>

    <div class="container">
      <h2>Elegant Clock Collection</h2>
      <div class="clock-cards">
        <!-- Clock Card 1 -->
        <div class="clock-card">
          <img src="images/e6.jpg" alt="Luxury Clock">
          <h3>Luxury Wall Clock</h3>
          <p>Rs.18750/=</p>
          <button onclick="addToCart('Luxury Wall Clock')">Add to Cart</button>
        </div>
  
        <!-- Clock Card 2 -->
        <div class="clock-card">
          <img src="images/e2.jpg" alt="Modern Clock">
          <h3>Modern Desk Clock</h3>
          <p>Rs.20100</p>
          <button onclick="addToCart('Modern Desk Clock')">Add to Cart</button>
        </div>
  
        <!-- Clock Card 3 -->
        <div class="clock-card">
          <img src="images/e4.webp" alt="Vintage Clock">
          <h3>Vintage Mantle Clock</h3>
          <p>Rs.16999/=</p>
         <a href="cart.html"><button>Add to Cart</button></a>
        </div>
      </div>
    </div>
  </section>
  <script>function addToCart(clockName) {
    alert(`${clockName} has been added to your cart!`);
  }
  function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goBack() {
  history.back(); // Goes to the previous page in the browser history
}
  </script>
