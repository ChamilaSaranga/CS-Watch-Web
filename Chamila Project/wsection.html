<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Collection</title>
    <style>body {
    font-family: Arial, sans-serif;
    background-image: url('backg.jpg');
    background-size: cover;
    background-position: center;
    margin: 0;
    padding: 0;
}

.collection-container {
    background: rgba(255, 255, 255, 0.9);
    margin: 50px auto;
    width: 90%;
    max-width: 1200px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    text-align: center;
}

h1 {
    color: #333;
    margin-bottom: 20px;
}

.back-button {
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 15px;
    font-size: 16px;
    color: white;
    background: #333;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s;
}

.back-button:hover {
    background: #555;
}

.collection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.watch-card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s, box-shadow 0.3s;
}

.watch-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
}

.watch-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.watch-card .details {
    padding: 15px;
    text-align: center;
}

.watch-card .details h2 {
    font-size: 18px;
    color: #333;
    margin-bottom: 10px;
}

.watch-card .details p {
    font-size: 14px;
    color: #666;
    margin-bottom: 15px;
}

.watch-card .details .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.watch-card .details button {
    padding: 10px 15px;
    font-size: 14px;
    color: white;
    background: #333;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s;
}

.watch-card .details button:hover {
    background: #555;
}

.explore-button {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    color: white;
    background: #333;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s;
}

.explore-button:hover {
    background: #555;
}
</style>
</head>
<body>
    <div class="collection-container">
        <button class="back-button" onclick="goBack()">← Back</button>
        <h1>Our Watch Collection</h1>
        <div class="collection-grid" id="watch-collection">
            <!-- Watches will be dynamically loaded here -->
        </div>
        <button class="explore-button" onclick="exploreMore()">Explore More</button>
    </div>
    <script>const watches = [
    {
        id: 1,
        name: "Classic Watch",
        description: "A timeless piece with leather straps.",
        price: 199.99,
        image: "watch1.jpg",
    },
    {
        id: 2,
        name: "Luxury Gold Watch",
        description: "Elegance and style in every second.",
        price: 299.99,
        image: "watch2.jpg",
    },
    {
        id: 3,
        name: "Modern Digital Watch",
        description: "Smart technology with a sleek design.",
        price: 149.99,
        image: "watch3.jpg",
    },
    {
        id: 4,
        name: "Sports Watch",
        description: "Durable and perfect for adventures.",
        price: 99.99,
        image: "watch4.jpg",
    },
];

const collectionContainer = document.getElementById("watch-collection");

function renderWatches() {
    collectionContainer.innerHTML = watches.map(watch => `
        <div class="watch-card">
            <img src="${watch.image}" alt="${watch.name}">
            <div class="details">
                <h2>${watch.name}</h2>
                <p>${watch.description}</p>
                <p><strong>$${watch.price.toFixed(2)}</strong></p>
                <div class="actions">
                    <button onclick="buyNow(${watch.id})">Buy</button>
                    <button onclick="exploreDetails(${watch.id})">Explore More</button>
                </div>
            </div>
        </div>
    `).join("");
}

function goBack() {
    window.history.back(); // Goes back to the previous page
}

function exploreMore() {
    alert("Exploring more watches... (redirect to more watches page)");
    // You can redirect to another page:
    // window.location.href = 'explore.html';
}

function buyNow(id) {
    const watch = watches.find(watch => watch.id === id);
    alert(`You bought ${watch.name} for $${watch.price.toFixed(2)}!`);
}

function exploreDetails(id) {
    const watch = watches.find(watch => watch.id === id);
    alert(`Explore more details about ${watch.name}...`);
    // You can redirect to a details page or open a modal here:
    // window.location.href = `details.html?id=${id}`;
}

renderWatches();
</script>
</body>
</html>
